# **RevenueCat pour Android** : l'app Google Play, ses abonnements, l'entitlement et
# l'offering. Voir store/revenuecat-android.mjs. Se lance quand le script change, ou à la main.
name: RevenueCat Android

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "store/revenuecat-android.mjs"
      - ".github/workflows/revenuecat-android.yml"

permissions:
  contents: read

jobs:
  configure:
    name: Configurer RevenueCat (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Configurer
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
        run: node store/revenuecat-android.mjs --apply
