# **Les abonnements Google Play** (store/play-subscriptions.json), créés ou mis à jour par
# RevenueCat. Voir store/revenuecat-play.mjs.
name: RevenueCat Google Play

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "store/play-subscriptions.json"
      - "store/revenuecat-play.mjs"
      - ".github/workflows/revenuecat-play.yml"

permissions:
  contents: read

jobs:
  apply:
    name: Poser les abonnements Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Plan, vérification, application
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          REVENUECAT_PROJECT_ID: ${{ secrets.REVENUECAT_PROJECT_ID }}
        run: node store/revenuecat-play.mjs
