# Sonde temporaire : dans quel compte Stripe, et dans quel mode, la clé restreinte écrit-elle ?
# Ne lit que trois prix et l'identifiant du compte ; n'imprime jamais la clé.
name: "Stripe : sonde"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
        run: |
          echo "compte : $(curl -s -u "$KEY:" https://api.stripe.com/v1/account | jq -c '{id, livemode: (.livemode // "?"), name: (.settings.dashboard.display_name // .business_profile.name // "?"), error: .error.message}')"
          for p in price_1UXjeTQzdoFeOog0wsMCtwBa price_1UAqB547TFrcO0lvSacZ91Pp price_1UA59JQMgx8zg1703xvj1Cgk; do
            echo "$p : $(curl -s -u "$KEY:" https://api.stripe.com/v1/prices/$p | jq -c '{livemode, active, currency, lookup_key, unit_amount, error: .error.message}')"
          done
