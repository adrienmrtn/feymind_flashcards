# **Mika, du kit à l'app, en une commande** : lit le kit de Mika (la branche
# `assets/mika-kit` : `images-fixes/mika-<expression>.png`, PNG transparents de 1024 px),
# refait toutes ses images avec `scripts/mika-assets.py` (expressions, avatar, `MikaArt.swift`,
# avec la lueur, la lumière de contour et les joues), puis :
#   - publie le résultat et sa planche de contrôle (chaque expression sur la crème, le
#     graphite et le bleu) sur la branche `assets/mika-build` (écrasée à chaque fois :
#     `git checkout origin/assets/mika-build -- Micabo` le reprend) ;
#   - le commite sur la branche `target` si on le demande.
#
#   gh workflow run mika-encode.yml --ref <branche> -f target=<branche>
#
# Depuis le lot 9, Mika n'embarque plus de vidéo (tout mouvement est natif, à la cadence
# de l'écran) : un Linux suffit. Un push qui change le script ou ce fichier sur une branche
# claude/** le relance aussi, sans commiter (le résultat attend sur `assets/mika-build`).

name: Mika (images)

on:
  workflow_dispatch:
    inputs:
      kit:
        description: "Branche du kit de Mika"
        default: assets/mika-kit
      target:
        description: "Branche où commiter le résultat (vide : ne rien commiter)"
        default: ""
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/mika-encode.yml"
      - "scripts/mika-assets.py"

permissions:
  contents: write

concurrency:
  group: mika-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Images de Mika
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target || github.ref }}

      - name: Le kit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.kit || 'assets/mika-kit' }}
          path: build/kit

      - name: Python (Pillow, NumPy)
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet pillow numpy

      - name: Les images
        run: |
          mkdir -p build/controle
          build/venv/bin/python scripts/mika-assets.py build/kit --sheet build/controle/expressions.jpg | tee build/controle/rapport.txt
          {
            echo '## Mika : les expressions'
            echo '```'
            cat build/controle/rapport.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier sur assets/mika-build
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
        run: |
          rm -rf build/publish && mkdir -p build/publish/Micabo/Resources/Assets.xcassets build/publish/Micabo/DesignSystem/Components
          cp -R Micabo/Resources/Assets.xcassets/Mika build/publish/Micabo/Resources/Assets.xcassets/
          cp Micabo/DesignSystem/Components/MikaArt.swift build/publish/Micabo/DesignSystem/Components/
          cp -R build/controle build/publish/controle
          cd build/publish
          git init -q -b assets/mika-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Mika : images fabriquées depuis $SOURCE"
          git push -q -f "https://x-access-token:$TOKEN@github.com/$REPO.git" assets/mika-build

      - name: Commiter sur la branche
        if: ${{ inputs.target != '' && github.event_name == 'workflow_dispatch' }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Micabo/Resources/Assets.xcassets/Mika Micabo/DesignSystem/Components/MikaArt.swift
          if git diff --cached --quiet; then echo "rien n'a changé"; exit 0; fi
          git commit -q -m "Mika : expressions refaites depuis le kit"
          for attempt in 1 2 3 4 5; do
            git pull -q --no-rebase --no-edit origin "$TARGET" && git push -q origin "HEAD:$TARGET" && exit 0
            sleep 5
          done
          exit 1
