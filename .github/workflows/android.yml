# **Android, compilé et envoyé sur Google Play sans ouvrir Android Studio.**
#
# À chaque push qui touche `android/`, l'app est compilée en `.aab` (le format de Google Play)
# et gardée en artefact — c'est ce fichier qu'on dépose à la main la toute première fois.
# Ensuite, avec « [play] » dans le message du commit (ou Actions → « Android » → Run workflow),
# le build part tout seul dans le **test interne** de Google Play, l'équivalent de TestFlight.
# « [play-listing] » envoie en plus la fiche (textes des 26 langues, captures, icône, bannière)
# depuis `android/play/metadata`.
#
# Les secrets, une fois (voir docs/google-play.md) :
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — le compte de service relié à la Play Console.

name: Android

on:
  workflow_dispatch:
    inputs:
      listing:
        description: "Envoyer aussi la fiche Play (textes, captures)"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: com.micabo.app
  # « draft » tant que l'app n'a jamais été validée par Google : l'API refuse tout autre
  # statut pour une app en brouillon. Passer à « completed » après la première validation.
  RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

jobs:
  build:
    name: Compiler et envoyer
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MICABO_VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: La clé d'envoi
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Compiler le bundle
        run: gradle -p android :app:bundleRelease --no-daemon --stacktrace

      - name: Pas de clé, pas d'envoi
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Secrets de signature absents : le bundle n'est pas signé et ne peut pas aller sur Google Play. Voir docs/google-play.md."

      - uses: actions/upload-artifact@v4
        with:
          name: micabo-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Envoyer dans le test interne
        if: >-
          env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true' &&
          (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[play]'))
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ env.RELEASE_STATUS }}

      - name: Envoyer la fiche Play
        if: >-
          env.HAS_PLAY == 'true' &&
          (github.event.inputs.listing == 'true' || contains(github.event.head_commit.message, '[play-listing]'))
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          gem install fastlane --no-document -q
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          fastlane run supply \
            package_name:"$PACKAGE_NAME" \
            json_key:"$RUNNER_TEMP/play.json" \
            metadata_path:android/play/metadata \
            skip_upload_apk:true skip_upload_aab:true skip_upload_changelogs:true
          rm -f "$RUNNER_TEMP/play.json"
