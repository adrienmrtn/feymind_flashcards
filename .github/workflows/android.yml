# **Android, compilé et envoyé sur Google Play sans ouvrir Android Studio.**
#
# À chaque push qui touche `android/`, l'app est compilée en `.aab` (le format de Google Play)
# et gardée en artefact — c'est ce fichier qu'on dépose à la main la toute première fois.
# Ensuite, avec « [play] » dans le message du commit (ou Actions → « Android » → Run workflow),
# le build part tout seul dans le **test interne** de Google Play, l'équivalent de TestFlight.
# « [play-listing] » envoie en plus la fiche (textes des 26 langues, captures, icône, bannière)
# depuis `android/play/metadata`.
#
# Les secrets, une fois (voir docs/google-play.md) :
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON — le compte de service relié à la Play Console.

name: Android

on:
  workflow_dispatch:
    inputs:
      listing:
        description: "Envoyer aussi la fiche Play (textes, captures)"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  # « write » pour pousser la branche `android-build/run-<n>` (ci-dessous) ; rien d'autre n'écrit.
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: com.micabo.app
  # « draft » tant que l'app n'a jamais été validée par Google : l'API refuse tout autre
  # statut pour une app en brouillon. Passer à « completed » après la première validation.
  RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

jobs:
  build:
    name: Compiler et envoyer
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MICABO_VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: La clé d'envoi
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Compiler le bundle
        run: gradle -p android :app:bundleRelease --no-daemon --stacktrace

      # **L'APK d'essai**, à installer sur un téléphone sans Google Play : artefact
      # `micabo-apk-<n>` du run (un .zip à ouvrir sur le téléphone, puis l'APK dedans).
      - name: Compiler l'APK d'essai
        run: gradle -p android :app:assemblePreview --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: micabo-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/preview/app-preview.apk

      - name: Pas de clé, pas d'envoi
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::Secrets de signature absents, le bundle n'est pas signé et ne peut pas aller sur Google Play. Voir docs/google-play.md."

      # **Sans les secrets, le bundle non signé part sur une branche neuve,
      # `android-build/run-<n>`** : il se signe alors hors de GitHub, avec la clé d'envoi, puis
      # se dépose à la main dans la Play Console. Un bundle non signé ne contient rien de secret,
      # et chaque run a sa branche : rien n'est jamais écrasé.
      - name: Garder le bundle non signé sur une branche
        if: env.HAS_KEYSTORE != 'true'
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/micabo-unsigned.aab"
          echo "$MICABO_VERSION_CODE" > "$RUNNER_TEMP/out/version-code.txt"
          cd "$RUNNER_TEMP/out"
          git init -q -b "android-build/run-$RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Bundle Android non signé, run $RUN"
          git push -q "https://x-access-token:$TOKEN@github.com/$REPO.git" "android-build/run-$RUN"

      - uses: actions/upload-artifact@v4
        with:
          name: micabo-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Envoyer dans le test interne
        if: >-
          env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true' &&
          (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[play]'))
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ env.RELEASE_STATUS }}

      - name: Envoyer la fiche Play
        if: >-
          env.HAS_PLAY == 'true' &&
          (github.event.inputs.listing == 'true' || contains(github.event.head_commit.message, '[play-listing]'))
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          gem install fastlane --no-document -q
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play.json"
          fastlane run supply \
            package_name:"$PACKAGE_NAME" \
            json_key:"$RUNNER_TEMP/play.json" \
            metadata_path:android/play/metadata \
            skip_upload_apk:true skip_upload_aab:true skip_upload_changelogs:true
          rm -f "$RUNNER_TEMP/play.json"
