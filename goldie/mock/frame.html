<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Micabo — cadre App Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1320px; height: 2868px; overflow: hidden; }
  body {
    font-family: "DM Sans", -apple-system, system-ui, sans-serif;
    background: linear-gradient(168deg, #DCE8DC 0%, #E8EFE6 38%, #F6F4ED 72%, #FFFDF6 100%);
    color: #191714;
  }
  .tile { width: 1320px; height: 2868px; position: relative; overflow: hidden; }
  .copy {
    position: absolute; left: 100px; right: 100px; top: 150px; z-index: 2;
  }
  .copy.left { right: 360px; }
  h1 { font-size: 88px; font-weight: 700; letter-spacing: -2.2px; line-height: 1.02; }
  p.sub {
    margin-top: 26px; font-size: 34px; font-weight: 500; color: #6F6A60;
    line-height: 1.28; max-width: 18ch;
  }
  .device {
    position: absolute;
    width: 980px;
    left: 50%;
    top: 720px;
    transform: translateX(-50%);
    filter: drop-shadow(0 42px 70px rgba(25, 23, 20, 0.20));
  }
  .device.hero { width: 1100px; top: 640px; }
  .device.offset { left: auto; right: -40px; transform: none; top: 780px; width: 900px; }
  .device.tilt { transform: translateX(-48%) rotate(-7deg); top: 700px; width: 1020px; }
  .device.minimal { width: 1080px; top: 50%; transform: translate(-50%, -46%); }
  .bezel {
    background: linear-gradient(160deg, #f2f0ea 0%, #cfc9be 45%, #8f8a82 100%);
    border-radius: 86px;
    padding: 12px;
  }
  .bezel-inner {
    background: #11110f;
    border-radius: 76px;
    overflow: hidden;
    line-height: 0;
  }
  .screen { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="tile">
  <div class="copy" id="copy">
    <h1 id="headline"></h1>
    <p class="sub" id="subhead"></p>
  </div>
  <div class="device" id="device">
    <div class="bezel">
      <div class="bezel-inner">
        <img class="screen" id="screen" alt="" />
      </div>
    </div>
  </div>
</div>
<script>
  const scenes = {
    today: {
      headline: "Juste avant l'oubli",
      subhead: "Tes cartes reviennent le jour où tu commences à les perdre.",
      layout: "hero",
    },
    sheet: {
      headline: "Le cours, déjà fiché",
      subhead: "Dépose tes notes. Micabo écrit la fiche que tu relis.",
      layout: "offset",
    },
    study: {
      headline: "Tu te souviens, ou pas",
      subhead: "Quatre notes. Le plan suit. Rien d'autre à décider.",
      layout: "tilt",
    },
    exam: {
      headline: "Le jour J commande",
      subhead: "Tu donnes la date. Micabo resserre les cartes à l'approche.",
      layout: "classic",
    },
    courses: {
      headline: "PDF, photo ou vidéo",
      subhead: "Tes cours deviennent des fiches, puis des cartes.",
      layout: "classic",
    },
  };
  const id = new URLSearchParams(location.search).get("scene") || "today";
  const scene = scenes[id];
  document.getElementById("headline").textContent = scene.headline;
  document.getElementById("subhead").textContent = scene.subhead;
  const img = document.getElementById("screen");
  img.src = `../out/raw/iphone-6.9/${id}.png`;
  const copy = document.getElementById("copy");
  const device = document.getElementById("device");
  if (scene.layout === "classic") device.classList.add("hero");
  else device.classList.add(scene.layout);
  if (scene.layout === "offset") copy.classList.add("left");
  if (scene.layout === "minimal") copy.style.display = "none";
</script>
</body>
</html>
