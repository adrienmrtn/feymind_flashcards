<title>App Store Micabo — DA V3</title>
<!--
  Les sept images de la fiche App Store dans la direction artistique V3.3 (« marine, net, adulte ») :
  une page de 7 × 1320 px, coupée en sept images 1320 × 2868 (iPhone 6,9″) par `render.mjs`.

  Le parti pris : un seul fond marine pour toute la bande, traversé par une même lumière bleue ;
  sur chaque image, le téléphone reste en retrait et l'élément qui compte en sort, agrandi
  (la bonne réponse, la carte, le compte à rebours). On lit l'image en une seconde, même en vignette.

  Les écrans de l'app sont redessinés en HTML avec les jetons de `V3Color.swift` (thème marine),
  à 393 pt de large puis agrandis : ils restent nets. Mika vient de `design/mika-v3/mika.js`.
-->

  :root {
    /* V3Palette.night */
    --bg: #0B0F1C; --surface: #171C2C; --soft: #20263A; --line: #262D42; --lip: #3A4260;
    --ink: #F5F6FB; --ink2: #A9B1C6; --ink3: #6E7791;
    --accent: #5C88FF; --bright: #7FA2FF; --deep: #3F6BE8; --wash: #18224A; --wash2: #22306A;
    --yellow: #F7B41F; --yellowWash: #2B2412;
    --green: #34D399; --greenWash: #0F2E26;
    --red: #F87171; --redWash: #3A1820; --redInk: #FCA5A5;
    --brand: #3870FE;
    --S: 1320px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 9240px; height: 2868px; overflow: hidden; }
  body { position: relative; background: #EEF1F8; font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  /* Le fond clair (V3Palette.day) et son quadrillage */
  .grid { position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background-image: linear-gradient(rgba(56,112,254,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(56,112,254,.07) 2px, transparent 2px);
    background-size: 120px 120px; }
  /* La lumière qui traverse toute la bande */
  .light { position: absolute; left: 0; top: 0; z-index: 0; }

  .fit { display: inline-block; white-space: nowrap; }

  /* ---------- Titres ---------- */
  .title { position: absolute; z-index: 5; top: 175px; width: var(--S); text-align: center; }
  .title h2 { font-family: "Sofia"; font-weight: 900; font-size: 236px; line-height: .9; text-transform: uppercase; color: #0F1324; }
  em { font-style: normal; color: #3870FE; }

  /* ---------- Le téléphone : titane sombre, discret ---------- */
  .device {
    position: absolute; z-index: 2; top: 700px;
    --sw: 900px; padding: 14px;
    background: linear-gradient(150deg, #6F97FF, #3870FE 35%, #2A5BE0 75%, #5A86FF);
    border-radius: 150px;
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.25), 0 70px 140px rgba(31,71,184,.30);
  }
  .bezel { padding: 14px; background: #040508; border-radius: 137px; }
  .screen { width: 393px; height: 852px; zoom: calc(var(--sw) / 393px); border-radius: 54px; overflow: hidden; position: relative; background: var(--bg); }
  .mid   { left: 178px; }
  .right { left: 300px; }
  .left  { left: 56px; }

  /* ---------- L'élément qui sort du téléphone ---------- */
  .pop { position: absolute; z-index: 4; zoom: 2.9; filter: drop-shadow(0 14px 24px rgba(15,19,36,.35)); }

  /* ================== L'interface de l'app (en points iPhone) ================== */
  .sb { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 44px; font-weight: 600; font-size: 17px; }
  .sb .r { display: flex; gap: 6px; align-items: center; }
  .island { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; background: #000; border-radius: 20px; z-index: 5; }
  .ui-h { font-family: "Sofia"; font-weight: 900; }
  .muted { color: var(--ink2); }
  .faint { color: var(--ink3); }
  .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink3); }
  .card { background: var(--surface); border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line); }
  .ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bar { height: 10px; background: var(--soft); border-radius: 8px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 8px; }
  .cta { background: #fff; color: var(--bg); border-radius: 999px; font-family: "Sofia"; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #BFC6D9; }

  .tl div { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  .y { background: var(--wash2); color: var(--bright); border-radius: 8px; padding: 4px 8px; font-weight: 700; }

  .node { position: absolute; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; }
  .node.done { background: var(--accent); box-shadow: 0 6px 0 var(--deep); }
  .node.cur { background: var(--accent); box-shadow: 0 6px 0 var(--deep), 0 0 0 12px rgba(92,136,255,.18), 0 0 0 24px rgba(92,136,255,.07); }
  .node.lock { background: var(--soft); box-shadow: 0 6px 0 #151a29; color: var(--ink3); }
  .node svg { width: 46px; height: 46px; }

  .opt { padding: 24px 22px; border-radius: 18px; background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--line), 0 3px 0 var(--line);
         font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
  .opt.ok { background: var(--greenWash); box-shadow: inset 0 0 0 2px var(--green), 0 4px 0 #1d7a5a; }
  .opt.no { opacity: .5; }

  .bubble-me { align-self: flex-end; background: var(--accent); color: #fff; padding: 16px 20px; border-radius: 22px 22px 6px 22px; font-size: 19px; font-weight: 600; max-width: 80%; }
  .bubble-mika { font-size: 19px; line-height: 1.5; color: var(--ink2); }
  .screen b, .pop b { color: var(--ink); font-weight: 700; }
  .bubble-mika b { color: var(--ink); font-weight: 700; }

  .src { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink2); }
  .src span { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--soft); }
  .src svg { width: 26px; height: 26px; }
  /* ---------- Ouverture : grand titre et preuves ---------- */
  .hero { position: absolute; z-index: 5; left: 90px; top: 190px; font-family: "Sofia"; font-weight: 900; font-size: 250px; line-height: .86; text-transform: uppercase; color: #0F1324; }
  .proof { position: absolute; z-index: 5; width: 620px; text-align: center; color: #0F1324; }
  .proof .big { font-family: "Sofia"; font-weight: 900; font-size: 220px; line-height: .9; }
  .proof .lab { font-family: "Sofia"; font-weight: 800; font-size: 72px; color: #566078; margin-top: 4px; }
  .proof .stars { font-size: 70px; letter-spacing: 6px; color: #F7B41F; margin-top: 6px; }
  .proof .pic { width: 170px; height: 170px; margin: 0 auto 28px; border-radius: 48px; background: #3870FE; display: grid; place-items: center; box-shadow: 0 8px 0 #1F47B8, 0 30px 60px rgba(31,71,184,.3); }
  .proof .pic svg { width: 92px; height: 92px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .laurel { display: flex; align-items: center; justify-content: center; gap: 0; }
  .laurel .branch { width: 165px; height: 430px; flex: none; }
  .laurel .big { font-size: 270px; }
  .laurel .flip { transform: scaleX(-1); }
  /* ---------- Ouverture : la copie Seyès et la fiche ---------- */
  @font-face { font-family: "Caveat"; font-weight: 500; src: url("fonts/caveat-latin-500-normal.woff2"); }
  @font-face { font-family: "Caveat"; font-weight: 700; src: url("fonts/caveat-latin-700-normal.woff2"); }
  mark { background: none; color: #0F1324; position: relative; z-index: 0; }
  mark::after { content: ""; position: absolute; left: -2%; right: -2%; top: 52%; height: 38%; background: #FFD84D; z-index: -1; transform: rotate(-1.5deg); border-radius: 8px; }
  .rating { position: absolute; z-index: 5; top: 1010px; width: var(--S); display: flex; justify-content: center; align-items: center; gap: 18px;
    font-family: "Sofia"; font-weight: 800; font-size: 76px; color: #566078; }
  .rating .stars { color: #F7B41F; letter-spacing: 4px; font-size: 70px; }
  .rating b { font-weight: 900; color: #0F1324; }
  .sheet { position: absolute; z-index: 2; width: 980px; height: 1300px; border-radius: 10px;
    background-color: #FFFFFF;
    background-image:
      linear-gradient(90deg, transparent 158px, #E8505B 158px, #E8505B 162px, transparent 162px),
      linear-gradient(#A9B9EA 2px, transparent 2px),
      linear-gradient(#DCE3F6 1px, transparent 1px),
      linear-gradient(90deg, #DCE3F6 1px, transparent 1px);
    background-size: 100% 100%, 100% 72px, 100% 18px, 72px 100%;
    background-position: 0 0, 0 22px, 0 22px, 162px 0;
    box-shadow: 0 50px 100px rgba(15,19,36,.18), 0 2px 0 rgba(15,19,36,.06); }
  .hand { font-family: "Caveat"; font-weight: 700; font-size: 64px; line-height: 108px; color: #23379A; padding-left: 200px; padding-right: 30px; }
  .hand > div { white-space: nowrap; }
  .hand .hl { background: linear-gradient(transparent 30%, #FFE35A 30%, #FFE35A 90%, transparent 90%); }
  .hand s { color: #23379A; text-decoration-thickness: 5px; }
  .postit { position: absolute; z-index: 3; width: 380px; height: 360px; padding: 70px 30px 0 40px; background: #FFE35A;
    font-family: "Caveat"; font-weight: 700; font-size: 82px; line-height: .95; color: #3B2C00;
    box-shadow: 0 40px 70px rgba(15,19,36,.18); clip-path: polygon(0 0, 100% 0, 100% 86%, 88% 100%, 0 100%); }
  .swoosh { position: absolute; z-index: 4; overflow: visible; filter: drop-shadow(0 12px 18px rgba(31,71,184,.3)); }
  /* ---------- Ouverture : Mika en héros ---------- */
  .brand { position: absolute; z-index: 5; top: 170px; width: var(--S); display: flex; justify-content: center; align-items: center; gap: 36px; }
  .brand img { width: 200px; height: 200px; border-radius: 46px; box-shadow: 0 30px 60px rgba(15,19,36,.25); }
  .brand span { font-family: "Sofia"; font-weight: 900; font-size: 150px; color: #0F1324; letter-spacing: -.01em; }
  .say { position: absolute; z-index: 6; white-space: nowrap; padding: 46px 50px; border-radius: 70px; background: #fff;
    font-family: "Sofia"; font-weight: 900; font-size: 118px; line-height: .92; text-transform: uppercase; color: #0F1324;
    box-shadow: 0 40px 80px rgba(15,19,36,.18); }
  .say::after { content: ""; position: absolute; left: 90px; bottom: -58px; width: 90px; height: 90px; background: #fff;
    clip-path: polygon(0 0, 100% 0, 10% 100%); }
  /* ---------- Google Play : téléphone Android, image 1080 × 1920 (9:16) ---------- */
  html.android, html.android body { height: 2347px; }
  .android .island { display: none; }
  .android .punch { position: absolute; top: 14px; left: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: #000; z-index: 5; box-shadow: 0 0 0 3px #0B0F1C; }
  .android .device { border-radius: 118px; padding: 10px; }
  .android .bezel { border-radius: 108px; padding: 10px; }
  .android .screen { border-radius: 44px; }
  .android .sb { padding: 8px 26px 0 28px; font-size: 16px; font-weight: 500; }
  .android .rating { display: none; }
  .android .chat-input { bottom: 215px !important; }
  .android .rate-row { display: none !important; }

<div class="grid"></div>
<!-- Une seule lumière pour les sept images : elle ondule d'un écran à l'autre -->
<svg class="light" width="9240" height="2868" viewBox="0 0 9240 2868">
  <defs>
    <filter id="blur" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="140"/></filter>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <path d="M-200 1900 C 600 1500, 1100 2300, 1980 1800 S 3300 1200, 3960 1700 S 5200 2300, 5940 1700 S 7300 1200, 7920 1750 S 9000 2100, 9440 1700"
        fill="none" stroke="#7FA2FF" stroke-opacity=".35" stroke-width="700" filter="url(#blur)"/>
  <path d="M-200 1900 C 600 1500, 1100 2300, 1980 1800 S 3300 1200, 3960 1700 S 5200 2300, 5940 1700 S 7300 1200, 7920 1750 S 9000 2100, 9440 1700"
        fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="80" filter="url(#soft)"/>
</svg>

<script src="i18n.js"></script>
<script src="../../../design/mika-v3/mika.js"></script>
<script>
  // La langue vient de l'adresse : index.html?lang=de. Par défaut, le français.
  const LANG = new URLSearchParams(location.search).get("lang") || "fr";
  // La plateforme : ios (par défaut) ou android, pour Google Play.
  const ANDROID = new URLSearchParams(location.search).get("platform") === "android";
  if (ANDROID) {
    document.documentElement.classList.add("android");
    // Une image plus courte (9:16) : l'ouverture se resserre, le reste se recadre seul.
    const move = { "hero-brand": "110px", "hero-title": "360px", "hero-say": "950px", "hero-mika": "1120px", "ask-mika": "800px" };
    document.getElementById("ask-mika").style.left = "calc(var(--S) * 4 + 880px)";
    for (const [id, top] of Object.entries(move)) document.getElementById(id).style.top = top;
    document.getElementById("sources-pop").style.top = "calc(1690px / 2.9)";
  }
  const T = window.I18N[LANG];
  if (!T) throw new Error(`langue inconnue : ${LANG}`);
  document.documentElement.lang = T._lang;
  for (const el of document.querySelectorAll("[data-t]")) el.innerHTML = T[el.dataset.t];
  // Le sens de lecture : les titres suivent la langue, l'écran suit celle de l'app.
  for (const el of document.querySelectorAll(".title, .say, .rating")) el.dir = T._dir;
  for (const el of document.querySelectorAll(".screen, .pop")) el.dir = T._uiDir;
  const say = document.querySelector(".say");
  say.innerHTML = `<span class="fit">${say.innerHTML}</span>`;
</script>
<script>
  const sbHTML = `<div class="sb"><span>9:41</span><span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#F5F6FB"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#F5F6FB" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"/><path d="M4.2 7a5.5 5.5 0 0 1 7.6 0"/><circle cx="8" cy="10" r="1" fill="#F5F6FB"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#F5F6FB" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="#F5F6FB"/><rect x="24.5" y="4.5" width="2" height="4" rx="1" fill="#F5F6FB" opacity=".4"/></svg>
    </span></div>`;

  // Les lauriers : des feuilles le long d'un arc.
  for (const svg of document.querySelectorAll('[data-laurel]')) {
    let g = '<path d="M150 500 C 40 420, 30 200, 120 30" fill="none" stroke="#0F1324" stroke-width="10" stroke-linecap="round"/>';
    for (let i = 0; i < 9; i++) {
      const t = i / 8, x = 150 - 120*Math.sin(t*Math.PI*.82) + 0, y = 490 - t*460;
      const a = -50 + t*40;
      g += `<ellipse cx="${x-22}" cy="${y}" rx="34" ry="14" transform="rotate(${a} ${x-22} ${y})" fill="#0F1324"/>`;
      g += `<ellipse cx="${x+20}" cy="${y-18}" rx="30" ry="12" transform="rotate(${a-70} ${x+20} ${y-18})" fill="#0F1324"/>`;
    }
    svg.innerHTML = g;
  }
  const sbAndroid = `<div class="sb"><span>9:41</span><span class="r">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="#F5F6FB"><path d="M8 11.5L.6 3.6a10.6 10.6 0 0 1 14.8 0z"/></svg>
      <svg width="13" height="13" viewBox="0 0 13 13" fill="#F5F6FB"><path d="M13 0v13H0z"/></svg>
      <svg width="9" height="15" viewBox="0 0 9 15"><rect x="2.5" y="0" width="4" height="2" rx=".5" fill="#F5F6FB"/><rect x="0" y="1.5" width="9" height="13.5" rx="2" fill="#F5F6FB"/></svg>
    </span></div>`;
  for (const s of document.querySelectorAll('[data-sb]'))
    s.insertAdjacentHTML('afterbegin', ANDROID ? '<div class="punch"></div>' + sbAndroid : '<div class="island"></div>' + sbHTML);

  for (const el of document.querySelectorAll('[data-mika]')) {
    const o = JSON.parse(el.dataset.mika);
    if (o.extra) o.extra = MIKA[o.extra] || '';
    el.innerHTML = mika(o);
  }
  for (const el of document.querySelectorAll('[data-mika] svg')) el.style.display = 'block';

  // Une seule taille pour tous les titres : la plus grande qui laisse tout tenir.
  function fit(selector, maxWidth) {
    const spans = [...document.querySelectorAll(selector)];
    const hosts = spans.map(s => s.parentElement);
    let size = parseFloat(getComputedStyle(hosts[0]).fontSize);
    while (spans.some(s => s.getBoundingClientRect().width > maxWidth) && size > 40) {
      size -= 2;
      hosts.forEach(h => h.style.fontSize = size + "px");
    }
    return size;
  }
  // La bulle de Mika : la plus grande taille qui tient dans l'image.
  function fitSay() {
    const span = document.querySelector(".say > .fit"), host = span.parentElement;
    let size = parseFloat(getComputedStyle(host).fontSize);
    while (span.getBoundingClientRect().width > 700 && size > 40) { size -= 2; host.style.fontSize = size + "px"; }
    return size;
  }
  document.fonts.ready.then(() => {
    document.body.dataset.sizes = JSON.stringify([fitSay(), ...document.querySelectorAll(".title h2 > .fit")].map(el => { if (typeof el === "number") return el; el.classList.add("me"); const v = fit(".me", 1220); el.classList.remove("me"); return v; }));
    document.body.dataset.ready = "1";
  });
</script>
</body>
